  <text x="60" y="118" fill="#e8edf3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600">Session manager for DSH</text>
  <text x="60" y="162" fill="#9fb0c3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Offboard old sessions with a receipt: a 30-day recycle bin,</text>
  <text x="60" y="192" fill="#9fb0c3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">tiered deletion risk, and an attachment cleanup that verifies itself.</text>
